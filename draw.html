/* Layout: full-bleed dotted paper; frosted floating bars — actions on top, drawing tools in a bottom dock */
:root{
  --bg:#eceef3;
  --paper:#ffffff;
  --dots:#dcd9e2;
  --glass:rgba(255,255,255,.76);
  --glass-line:rgba(30,24,48,.08);
  --fg:#1f1c25;
  --muted:#6f6a7a;
  --line:#e2dfe8;
  --accent:#ff4f8b;
  --accent-soft:rgba(255,79,139,.14);
  --on-accent:#ffffff;
  --shadow:0 12px 32px rgba(32,20,48,.14),0 1px 2px rgba(32,20,48,.08);
  --font-ui:'Jw027','IBM Plex Sans Thai',system-ui,-apple-system,sans-serif;
  --font-display:'Jw027','Mali','IBM Plex Sans Thai',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121116;--glass:rgba(30,28,36,.78);--glass-line:rgba(255,255,255,.08);--fg:#f3f1f6;--muted:#a9a4b4;--line:#36323e;
    --accent:#ff6f9f;--accent-soft:rgba(255,111,159,.22);--on-accent:#1c0a13;--shadow:0 12px 32px rgba(0,0,0,.5);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121116;--glass:rgba(30,28,36,.78);--glass-line:rgba(255,255,255,.08);--fg:#f3f1f6;--muted:#a9a4b4;--line:#36323e;
  --accent:#ff6f9f;--accent-soft:rgba(255,111,159,.22);--on-accent:#1c0a13;--shadow:0 12px 32px rgba(0,0,0,.5);color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font-ui);overflow:hidden;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  -webkit-user-select:none;user-select:none;
}
.stage{position:fixed;inset:0;background-color:var(--paper);background-image:radial-gradient(var(--dots) 1.1px,transparent 1.4px);background-size:22px 22px}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.float{
  position:fixed;z-index:6;background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--shadow);border-radius:18px;box-sizing:border-box;
  -webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);
}
.top{
  top:calc(env(safe-area-inset-top,0px) + 12px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:4px;padding:6px 6px 6px 16px;flex-wrap:wrap;
}
.top h1{font-family:var(--font-display);font-weight:400;font-size:26px;margin:0 8px 0 0;white-space:nowrap;letter-spacing:.01em}
.spacer{flex:1}
.home{color:inherit;text-decoration:none}
.dock{
  bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:50%;transform:translateX(-50%);
  width:max-content;max-width:calc(100% - 24px);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 14px;padding:10px 14px;
}
.sep{width:1px;align-self:stretch;background:var(--line)}
.group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ibtn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:16px;color:var(--fg);background:transparent;
  border:1px solid transparent;border-radius:12px;padding:0 10px;height:40px;min-width:40px;cursor:pointer;white-space:nowrap;
  transition:background-color .15s,color .15s,transform .1s;
}
.ibtn svg{width:20px;height:20px;flex:none}
.ibtn:hover{background:var(--accent-soft)}
.ibtn:active{transform:scale(.96)}
.ibtn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.ibtn.pill{border-color:var(--line)}
.ibtn.solid{background:var(--fg);color:var(--bg)}
.ibtn.warn{border-color:var(--accent);color:var(--accent)}
.ibtn:disabled{opacity:.4;cursor:default;transform:none}
.ibtn:focus-visible,.swatch:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.langsel{font:inherit;font-size:15px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:10px;padding:0 8px;height:34px;cursor:pointer}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--glass);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;transition:transform .12s}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent);transform:scale(1.08)}
.picker{width:30px;height:30px;border:none;padding:0;background:none;cursor:pointer;border-radius:50%}
.picker::-webkit-color-swatch-wrapper{padding:0}
.picker::-webkit-color-swatch{border-radius:50%;border:1px dashed var(--muted)}
.slider{display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--muted);min-width:0}
.slider span{display:flex;justify-content:space-between;align-items:center;gap:8px}
.slider b{font-weight:500;color:var(--fg);background:var(--accent-soft);border-radius:999px;padding:0 8px;font-variant-numeric:tabular-nums}
.slider input{width:118px;accent-color:var(--accent);margin:0}
.guide{position:absolute;pointer-events:none}
.guide.v{top:0;bottom:0;left:50%;width:0;border-left:1.5px dashed rgba(255,79,139,.5)}
.guide.h{left:0;right:0;top:50%;height:0;border-top:1.5px dashed rgba(255,79,139,.5)}
.toast{
  position:fixed;z-index:8;top:calc(env(safe-area-inset-top,0px) + 76px);left:50%;transform:translateX(-50%);
  background:var(--fg);color:var(--bg);border-radius:999px;padding:6px 16px;font-size:15px;pointer-events:none;box-shadow:var(--shadow);
}
.hint{
  position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 132px);
  max-width:calc(100% - 32px);border-radius:12px;padding:7px 14px;font-size:15px;color:var(--muted);pointer-events:none;text-align:center;
}
.layers{
  top:calc(env(safe-area-inset-top,0px) + 76px);right:max(12px,env(safe-area-inset-right,0px));
  width:min(270px,calc(100% - 24px));padding:12px;display:flex;flex-direction:column;gap:10px;z-index:7;
}
.lhead{display:flex;justify-content:space-between;align-items:center;font-size:18px}
#layerList{display:flex;flex-direction:column;gap:2px}
.lrow{display:flex;align-items:center;gap:4px;border-radius:12px;padding:3px}
.lrow.on{background:var(--accent-soft)}
.lname{flex:1;min-width:0;text-align:left;font:inherit;font-size:16px;background:none;border:none;color:var(--fg);padding:6px;min-height:36px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{font:inherit;font-size:12px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:10px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ib:disabled{opacity:.3;cursor:default}
.lfoot{display:flex;gap:6px;flex-wrap:wrap}
.lfoot .ibtn{flex:1;font-size:15px;height:36px}
.overlay{
  position:fixed;inset:0;z-index:20;background:rgba(18,12,22,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}
.overlay[hidden]{display:none}
.sheet{background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--shadow);color:var(--fg);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;max-width:min(560px,100%);max-height:100%;box-sizing:border-box;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.sheet img{max-width:100%;max-height:62vh;object-fit:contain;border-radius:12px;background:#fff;-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
.sheet p{margin:0;font-size:16px;line-height:1.5}
.sheet .row{display:flex;justify-content:flex-end;gap:8px}
.codesheet{width:min(420px,100%)}
.codesheet h2{margin:0;font-weight:400;font-size:24px}
.codein{font:inherit;font-family:ui-monospace,Menlo,monospace;font-size:18px;letter-spacing:.06em;text-transform:uppercase;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:#1f1c25;-webkit-user-select:text;user-select:text;width:100%;box-sizing:border-box}
.msg{color:var(--accent)}
.buy{color:var(--muted);font-size:15px}
.buy a{color:var(--accent);font-weight:600}
@media (max-width:760px){
  .ibtn .lbl{display:none}
  .top h1{font-size:21px}
  .slider input{width:92px}
  .dock .sep{display:none}
  .hint{bottom:calc(env(safe-area-inset-bottom,0px) + 186px);font-size:14px}
  .toast,.layers{top:calc(env(safe-area-inset-top,0px) + 124px)}
}
@media (prefers-reduced-motion:reduce){.ibtn,.swatch{transition:none}}
</style>

</head>
<body>
<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="guide v" id="guideV" hidden></div>
  <div class="guide h" id="guideH" hidden></div>
</div>

<header class="float top">
  <a href="index.html" class="home" aria-label="หน้าแรก"><h1 data-i="title">เส้นขยุกขยิก</h1></a>
  <select id="lang" class="langsel" aria-label="Language"><option value="th">ไทย</option><option value="en">English</option></select>
  <div class="spacer"></div>
  <button class="ibtn" id="undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span class="lbl" data-i="undo">ย้อนกลับ</span></button>
  <button class="ibtn" id="redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg><span class="lbl" data-i="redo">ทำซ้ำ</span></button>
  <button class="ibtn pill" id="zoom" title="แตะเพื่อกลับไป 100%">100%</button>
  <button class="ibtn" id="layerBtn" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg><span class="lbl" id="layerL">เลเยอร์</span></button>
  <button class="ibtn pill" id="unlockBtn" data-i="unlock">ปลดล็อก 29฿</button>
  <button class="ibtn pill" id="gifBtn" data-i="gif">บันทึก GIF</button>
  <button class="ibtn solid" id="save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg><span class="lbl" data-i="save">บันทึกรูป</span></button>
</header>

<div class="float dock">
  <div class="group" id="swatches" aria-label="สีเส้น"></div>
  <div class="sep"></div>
  <label class="slider" for="size"><span><span data-i="size">ขนาดเส้น</span> <b id="sizeV"></b></span><input id="size" type="range" min="1" max="20" step="0.5" value="3"></label>
  <label class="slider" for="amp"><span><span data-i="wobble">ความหยึกหยัก</span> <b id="ampV"></b></span><input id="amp" type="range" min="0" max="10" step="0.5" value="2.5"></label>
  <label class="slider" for="freq"><span><span data-i="freq">คลื่นถี่</span> <b id="freqV"></b></span><input id="freq" type="range" min="1" max="10" step="1" value="6"></label>
  <div class="sep"></div>
  <div class="group">
    <button class="ibtn" id="eraser" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 21h10"/><path d="M5.5 14.5l8-8a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L12 18H8.5z"/></svg><span class="lbl" data-i="eraser">ยางลบ</span></button>
    <button class="ibtn" id="boil" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12c2-4 4-4 6 0s4 4 6 0 4-4 6 0"/></svg><span class="lbl" data-i="boil">เส้นดุ๊กดิ๊ก</span></button>
    <button class="ibtn" id="mirror" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18" stroke-dasharray="2 3"/><path d="M9 7L4 17h5z"/><path d="M15 7l5 10h-5z"/></svg><span id="mirrorL">กระจก: ปิด</span></button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<div class="float hint" id="hint" data-i="hint" hidden>ภาพตัวอย่าง · วาดต่อได้เลย หรือแตะ “ล้างเลเยอร์” เพื่อเริ่มใหม่</div>

<div class="float layers" id="layers" hidden>
  <div class="lhead"><span data-i="layers">เลเยอร์</span><button class="ibtn pill" id="addLayer" data-i="add">+ เพิ่ม</button></div>
  <div id="layerList"></div>
  <div class="lfoot"><button class="ibtn pill" id="clear">ล้างเลเยอร์</button><button class="ibtn pill" id="delLayer" data-i="del">ลบเลเยอร์นี้</button></div>
</div>

<div class="overlay" id="codeOv" hidden>
  <div class="sheet codesheet">
    <h2 data-i="unlockTitle">ปลดล็อกเวอร์ชันเต็ม</h2>
    <p data-i="unlockDesc"></p>
    <input id="codeIn" class="codein" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="WOBBLE-XXXX-XXXX">
    <p id="codeMsg" class="msg" hidden></p>
    <p class="buy" data-ih="buy"></p>
    <div class="row"><button class="ibtn pill" id="codeCancel" data-i="close">ปิด</button><button class="ibtn solid" id="codeOk" data-i="confirm">ยืนยัน</button></div>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet">
    <img id="outImg" alt="รูปที่วาด">
    <p data-ih="saveHelp">กดค้างที่รูป แล้วเลือก <b>บันทึกลงในรูปภาพ</b> (Save to Photos)</p>
    <div class="row"><button class="ibtn solid" id="closeOv" data-i="close">ปิด</button></div>
  </div>
</div>

<script>
(function(){
  const COLORS=['#4b4b4b','#151515','#e0527a','#a35f9e','#3d7bd9','#2f8a57','#e08a2e'];
  const KEY='wobble-strokes-v1', KEY2='wobble-layers-v1', MAXL=10, FREE_L=2;
  const maxL=()=>unlocked?MAXL:FREE_L;
  const cv=document.getElementById('cv'), mainCtx=cv.getContext('2d'), stage=document.getElementById('stage');
  let ctx=mainCtx;
  const hint=document.getElementById('hint');
  const $=id=>document.getElementById(id);
  let layers=[], active=0, hist=[], nextId=1;
  const lcs=new Map();
  function newLayer(){const id=nextId++;return{id,name:'เลเยอร์ '+id,visible:true,strokes:[]}}
  function lc(id){let c=lcs.get(id);if(!c){c=document.createElement('canvas');lcs.set(id,c)}if(c.width!==cv.width||c.height!==cv.height){c.width=cv.width;c.height=cv.height}return c}
  let W=0,H=0,dpr=1, current=null, tick=0, boilTimer=null, penSeen=false, isSample=false, rafPending=false;
  const st={color:COLORS[0], size:3, amp:2.5, freq:6, erase:false, boil:false, mirror:0};
  const I={
    th:{title:'เส้นขยุกขยิก',size:'ขนาดเส้น',wobble:'ความหยึกหยัก',freq:'คลื่นถี่',off:'ปิด',eraser:'ยางลบ',boil:'เส้นดุ๊กดิ๊ก',mirror:'กระจก',mirrors:['ปิด','ซ้าย-ขวา','บน-ล่าง','4 ทาง'],zoomTip:'แตะเพื่อกลับไป 100%',undo:'ย้อนกลับ',redo:'ทำซ้ำ',layers:'เลเยอร์',layer:'เลเยอร์',clear:'ล้างเลเยอร์',tapClear:'แตะอีกครั้งเพื่อล้าง',save:'บันทึกรูป',unlock:'ปลดล็อก 29฿',unlockTitle:'ปลดล็อกเวอร์ชันเต็ม',unlockDesc:'จ่ายครั้งเดียว 29 บาท ได้ลบลายน้ำ “แมวดำยุกยิก” และใช้ได้ถึง 10 เลเยอร์ (ฟรีใช้ได้ 2 เลเยอร์) กรอกโค้ดที่ได้จากการซื้อเพื่อปลดล็อกในเครื่องนี้',addLock:'+ เพิ่ม (29฿)',layerLimit:'เวอร์ชันฟรีใช้ได้ 2 เลเยอร์ ปลดล็อกเพื่อใช้ได้ถึง 10 เลเยอร์',confirm:'ยืนยัน',badCode:'โค้ดไม่ถูกต้อง ลองเช็กตัวอักษรอีกครั้ง',unlocked:'ปลดล็อกแล้ว ขอบคุณที่สนับสนุนนะ',buy:'ยังไม่มีโค้ด? ซื้อได้ในราคา <b>29 บาท</b> ทักที่เพจ <a href="https://www.facebook.com/share/19oWpEZDAw/" target="_blank" rel="noopener">แมวดำตัวอ้วน</a>',wm:'แมวดำยุกยิก',gif:'บันทึก GIF',making:'กำลังทำ GIF…',hint:'ภาพตัวอย่าง · วาดต่อได้เลย หรือแตะ “ล้างเลเยอร์” เพื่อเริ่มใหม่',add:'+ เพิ่ม',del:'ลบเลเยอร์นี้',tapDel:'แตะอีกครั้งเพื่อลบ',hiddenS:' (ซ่อน)',hide:'ซ่อน',show:'แสดง',up:'เลื่อนขึ้น',down:'เลื่อนลง',hiddenToast:'เลเยอร์นี้ซ่อนอยู่',saveHelp:'กดค้างที่รูป แล้วเลือก <b>บันทึกลงในรูปภาพ</b> (Save to Photos)',close:'ปิด',imgAlt:'รูปที่วาด',color:'สี',custom:'เลือกสีเอง',colors:'สีเส้น'},
    en:{title:'Wobbly Lines',size:'Size',wobble:'Wobble',freq:'Waves',off:'Off',eraser:'Eraser',boil:'Boil',mirror:'Mirror',mirrors:['Off','Left–Right','Top–Bottom','4-way'],zoomTip:'Tap to reset to 100%',undo:'Undo',redo:'Redo',layers:'Layers',layer:'Layer',clear:'Clear layer',tapClear:'Tap again to clear',save:'Save image',unlock:'Unlock ฿29',unlockTitle:'Unlock the full version',unlockDesc:'Pay ฿29 once to remove the “แมวดำยุกยิก” watermark and use up to 10 layers (free version has 2). Enter the code you bought to unlock this device.',addLock:'+ Add (฿29)',layerLimit:'The free version has 2 layers. Unlock to use up to 10.',confirm:'Confirm',badCode:'That code doesn’t match. Check the letters and try again.',unlocked:'Unlocked. Thanks for your support!',buy:'No code yet? Get one for <b>฿29</b> — message the <a href="https://www.facebook.com/share/19oWpEZDAw/" target="_blank" rel="noopener">แมวดำตัวอ้วน</a> page',wm:'แมวดำยุกยิก',gif:'Save GIF',making:'Making GIF…',hint:'Example drawing · Keep drawing, or tap “Clear layer” to start over',add:'+ Add',del:'Delete layer',tapDel:'Tap again to delete',hiddenS:' (hidden)',hide:'Hide',show:'Show',up:'Move up',down:'Move down',hiddenToast:'This layer is hidden',saveHelp:'Press and hold the image, then choose <b>Save to Photos</b>',close:'Close',imgAlt:'Your drawing',color:'Color',custom:'Pick a color',colors:'Line colors'},
    ja:{title:'ゆらゆら線',size:'太さ',wobble:'ゆらぎ',freq:'波の細かさ',off:'オフ',eraser:'消しゴム',boil:'ぷるぷる線',mirror:'ミラー',mirrors:['オフ','左右','上下','4方向'],zoomTip:'タップで100%に戻す',undo:'取り消し',redo:'やり直し',layers:'レイヤー',layer:'レイヤー',clear:'レイヤーを消去',tapClear:'もう一度タップで消去',save:'画像を保存',hint:'サンプル画像 · そのまま描くか「レイヤーを消去」で最初から',add:'+ 追加',del:'このレイヤーを削除',tapDel:'もう一度タップで削除',hiddenS:'（非表示）',hide:'隠す',show:'表示',up:'上へ',down:'下へ',hiddenToast:'このレイヤーは非表示です',saveHelp:'画像を長押しして<b>「写真に保存」</b>を選んでください',close:'閉じる',imgAlt:'描いた絵',color:'色',custom:'色を選ぶ',colors:'線の色'},
    zh:{title:'抖抖线',size:'粗细',wobble:'抖动',freq:'波纹密度',off:'关',eraser:'橡皮擦',boil:'动态线',mirror:'镜像',mirrors:['关','左右','上下','四向'],zoomTip:'点按恢复 100%',undo:'撤销',redo:'重做',layers:'图层',layer:'图层',clear:'清空图层',tapClear:'再点一次清空',save:'保存图片',hint:'示例图 · 可以接着画，或点“清空图层”重新开始',add:'+ 添加',del:'删除此图层',tapDel:'再点一次删除',hiddenS:'（隐藏）',hide:'隐藏',show:'显示',up:'上移',down:'下移',hiddenToast:'此图层已隐藏',saveHelp:'长按图片，然后选择<b>“存储到照片”</b>',close:'关闭',imgAlt:'我的画',color:'颜色',custom:'自选颜色',colors:'线条颜色'}
  };
  delete I.ja;delete I.zh;
  let lang='th';try{const v=localStorage.getItem('wobble-lang');if(I[v])lang=v}catch(_){}
  const t=k=>I[lang][k]??I.th[k];
  const lname=L=>t('layer')+' '+L.id;
  const mirrorLabel=()=>t('mirror')+': '+t('mirrors')[st.mirror];
  const sliderUps=[];
  const view={s:1,tx:0,ty:0};

  // ---- UI ----
  const sw=$('swatches');
  COLORS.forEach(c=>{
    const b=document.createElement('button');b.className='swatch';b.style.background=c;b.setAttribute('aria-label',t('color')+' '+c);
    b.setAttribute('aria-pressed',c===st.color);b.onclick=()=>pickColor(c);sw.appendChild(b);
  });
  const pk=document.createElement('input');pk.type='color';pk.className='picker';pk.id='picker';pk.value='#4b4b4b';pk.setAttribute('aria-label',t('custom'));
  pk.oninput=()=>pickColor(pk.value,true);sw.appendChild(pk);
  function pickColor(c,custom){
    st.color=c; st.erase=false; $('eraser').setAttribute('aria-pressed','false');
    sw.querySelectorAll('.swatch').forEach(b=>b.setAttribute('aria-pressed',!custom&&b.style.background&&rgb(b.style.background)===c.toLowerCase()));
  }
  function rgb(s){const m=s.match(/\d+/g);return m?'#'+m.slice(0,3).map(n=>(+n).toString(16).padStart(2,'0')).join(''):s}
  function bindSlider(id,key,fmt){const el=$(id),v=$(id+'V');const up=()=>{st[key]=+el.value;v.textContent=fmt(st[key])};el.oninput=up;up();sliderUps.push(up)}
  bindSlider('size','size',v=>v+' px');
  bindSlider('amp','amp',v=>v===0?t('off'):v);
  bindSlider('freq','freq',v=>v);
  $('eraser').onclick=e=>{st.erase=!st.erase;e.currentTarget.setAttribute('aria-pressed',st.erase)};
  $('boil').onclick=e=>{st.boil=!st.boil;e.currentTarget.setAttribute('aria-pressed',st.boil);setBoil()};
  $('mirror').onclick=e=>{
    st.mirror=(st.mirror+1)%4;const b=e.currentTarget;
    $('mirrorL').textContent=mirrorLabel();b.setAttribute('aria-pressed',st.mirror>0);
    $('guideV').hidden=!(st.mirror===1||st.mirror===3);$('guideH').hidden=!(st.mirror===2||st.mirror===3);
  };
  let redoStack=[];
  const byId=id=>layers.find(l=>l.id===id);
  function undo(){
    while(hist.length){const lid=hist.pop();const L=byId(lid);if(L&&L.strokes.length){redoStack.push({lid,s:L.strokes.pop()});persist();draw();toast(t('undo'));return}}
  }
  function redo(){
    while(redoStack.length){const it=redoStack.pop();const L=byId(it.lid);if(L){L.strokes.push(it.s);hist.push(L.id);persist();draw();toast(t('redo'));return}}
  }

  // ---- layers panel ----
  const EYE='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  const EYE_OFF='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a9.8 9.8 0 0 0 5.4-1.6"/></svg>';
  $('layerBtn').onclick=e=>{const p=$('layers');p.hidden=!p.hidden;e.currentTarget.setAttribute('aria-pressed',!p.hidden)};
  function commitLayers(){renderLayers();persist();draw()}
  function renderLayers(){
    $('layerL').textContent=t('layers')+' '+layers.length+'/'+maxL();
    $('addLayer').disabled=layers.length>=MAXL;$('addLayer').textContent=(!unlocked&&layers.length>=FREE_L)?t('addLock'):t('add');$('delLayer').disabled=layers.length<=1;
    const list=$('layerList');list.innerHTML='';
    for(let i=layers.length-1;i>=0;i--){
      const L=layers[i];const row=document.createElement('div');row.className='lrow'+(i===active?' on':'');
      const eye=document.createElement('button');eye.className='ib';eye.innerHTML=L.visible?EYE:EYE_OFF;
      eye.setAttribute('aria-label',(L.visible?t('hide'):t('show'))+' '+lname(L));
      eye.onclick=()=>{L.visible=!L.visible;commitLayers()};
      const nm=document.createElement('button');nm.className='lname';nm.textContent=lname(L)+(L.visible?'':t('hiddenS'));
      nm.onclick=()=>{active=i;renderLayers();persist()};
      const up=document.createElement('button');up.className='ib';up.textContent='▲';up.setAttribute('aria-label',t('up'));up.disabled=i===layers.length-1;
      up.onclick=()=>{[layers[i],layers[i+1]]=[layers[i+1],layers[i]];if(active===i)active=i+1;else if(active===i+1)active=i;commitLayers()};
      const dn=document.createElement('button');dn.className='ib';dn.textContent='▼';dn.setAttribute('aria-label',t('down'));dn.disabled=i===0;
      dn.onclick=()=>{[layers[i],layers[i-1]]=[layers[i-1],layers[i]];if(active===i)active=i-1;else if(active===i-1)active=i;commitLayers()};
      row.append(eye,nm,up,dn);list.appendChild(row);
    }
  }
  $('addLayer').onclick=()=>{if(!unlocked&&layers.length>=FREE_L){openCode(t('layerLimit'));return}if(layers.length>=MAXL)return;layers.splice(active+1,0,newLayer());active++;commitLayers()};
  let delArmed=null;
  $('delLayer').onclick=e=>{
    if(layers.length<=1)return;const b=e.currentTarget;
    if(!delArmed){b.textContent=t('tapDel');delArmed=setTimeout(()=>{delArmed=null;b.textContent=t('del')},2500);return}
    clearTimeout(delArmed);delArmed=null;b.textContent=t('del');
    const L=layers[active];layers.splice(active,1);lcs.delete(L.id);
    hist=hist.filter(x=>x!==L.id);redoStack=redoStack.filter(x=>x.lid!==L.id);
    active=Math.min(active,layers.length-1);commitLayers();
  };
  let toastT=null;
  function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},700)}
  $('undo').onclick=undo;
  $('redo').onclick=redo;
  $('zoom').onclick=()=>{Object.assign(view,{s:1,tx:0,ty:0});draw()};
  let clearArmed=null;
  $('clear').onclick=e=>{
    const b=e.currentTarget;
    if(!clearArmed){b.textContent=t('tapClear');b.classList.add('warn');clearArmed=setTimeout(resetClear,2500);return}
    resetClear();const L=layers[active];L.strokes=[];hist=hist.filter(x=>x!==L.id);redoStack=redoStack.filter(x=>x.lid!==L.id);
    isSample=false;hint.hidden=true;persist();draw();
  };
  function resetClear(){clearTimeout(clearArmed);clearArmed=null;$('clear').textContent=t('clear');$('clear').classList.remove('warn')}
  $('save').onclick=()=>{
    const bx=bounds();const sc=Math.min(2.5,2400/Math.max(bx.w,bx.h));
    const w=Math.max(1,Math.round(bx.w*sc)),h=Math.max(1,Math.round(bx.h*sc));
    const o=renderFrame(st.boil?tick:null,sc,w,h,bx.x,bx.y);draw();
    $('outImg').src=o.toDataURL('image/png');$('overlay').hidden=false;
  };

  // ---- animated GIF export (3 wobble frames, looping) ----
  function bounds(){
    let x0=0,y0=0,x1=W,y1=H;
    for(const L of layers){if(!L.visible)continue;for(const s of L.strokes){
      if(s.erase)continue;const pad=s.size/2+s.amp+2,m=s.mirror||0;
      const fl=[[1,1]];if(m===1)fl.push([-1,1]);if(m===2)fl.push([1,-1]);if(m===3)fl.push([-1,1],[1,-1],[-1,-1]);
      for(const p of s.pts)for(const[fx,fy]of fl){
        const x=fx<0?2*s.ax-p[0]:p[0],y=fy<0?2*s.ay-p[1]:p[1];
        if(x-pad<x0)x0=x-pad;if(y-pad<y0)y0=y-pad;if(x+pad>x1)x1=x+pad;if(y+pad>y1)y1=y+pad;
      }
    }}
    const M=(x0<0||y0<0||x1>W||y1>H)?24:0;
    return{x:x0-M,y:y0-M,w:x1-x0+2*M,h:y1-y0+2*M};
  }
  function renderFrame(k,sc,w,h,ox,oy){
    const out=document.createElement('canvas');out.width=w;out.height=h;
    const o=out.getContext('2d');o.fillStyle='#ffffff';o.fillRect(0,0,w,h);
    const tmp=document.createElement('canvas');tmp.width=w;tmp.height=h;
    for(const L of layers){
      if(!L.visible)continue;
      ctx=tmp.getContext('2d');ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,w,h);ctx.setTransform(sc,0,0,sc,-ox*sc,-oy*sc);

  function watermark(o,w,h){
    const fs=Math.max(14,Math.round(Math.min(w,h)*0.035));
    o.save();o.textBaseline='middle';o.textAlign='center';
    o.font=fs+"px Jw027, 'IBM Plex Sans Thai', sans-serif";o.fillStyle='rgba(40,30,45,0.07)';
    o.translate(w/2,h/2);o.rotate(-Math.PI/7);
    const R=Math.hypot(w,h);const gx=fs*9,gy=fs*4.6;
    for(let y=-R;y<R;y+=gy)for(let x=-R+((y/gy)%2?gx/2:0);x<R;x+=gx)o.fillText(t('wm'),x,y);
    o.restore();
    o.save();o.font=Math.round(fs*1.05)+"px Jw027, 'IBM Plex Sans Thai', sans-serif";o.textAlign='right';o.textBaseline='bottom';
    o.fillStyle='rgba(255,255,255,0.85)';const tw=o.measureText(t('wm')).width;const pad=fs*0.6;
    o.fillRect(w-tw-pad*2.2,h-fs*1.9,tw+pad*2.2,fs*1.9);
    o.fillStyle='rgba(40,30,45,0.75)';o.fillText(t('wm'),w-pad*1.1,h-fs*0.45);o.restore();
  }

  // ---- geometry ----
  function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  function smooth(p){
    if(p.length<5)return p;const o=[];
    for(let i=0;i<p.length;i++){let x=0,y=0,n=0;for(let k=-2;k<=2;k++){const q=p[Math.min(p.length-1,Math.max(0,i+k))];x+=q[0];y+=q[1];n++}o.push([x/n,y/n])}
    o[0]=p[0];o[o.length-1]=p[p.length-1];return o;
  }
  function resample(p,step){
    const out=[[p[0][0],p[0][1],0]];let d=0,acc=0;
    for(let i=1;i<p.length;i++){

  }

    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';

    const rs=resample(smooth(pts),1.2);const n=rs.length;

  }
  function draw(){
    mainCtx.setTransform(1,0,0,1,0,0);mainCtx.clearRect(0,0,cv.width,cv.height);
    $('guideV').style.left=(view.tx+view.s*W/2)+'px';$('guideH').style.top=(view.ty+view.s*H/2)+'px';
    $('zoom').textContent=Math.round(view.s*100)+'%';

      if(!L.visible)continue;
      const c=lc(L.id);ctx=c.getContext('2d');
      ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height);
      ctx.setTransform(dpr*view.s,0,0,dpr*view.s,dpr*view.tx,dpr*view.ty);
      for(const s of L.strokes)renderStroke(s,st.boil?(tick+s.seed)%3:0);
      if(current&&current.lid===L.id)renderStroke(current,st.boil?(tick+current.seed)%3:0);
      mainCtx.drawImage(c,0,0);
    }

  const touches=new Map();let gest=null,pinch=null;

  function startPinch(){
    const[a,b]=two();const r=cv.getBoundingClientRect();
    pinch={s0:view.s,tx0:view.tx,ty0:view.ty,d0:Math.hypot(a.x-b.x,a.y-b.y)||1,mx:(a.x+b.x)/2-r.left,my:(a.y+b.y)/2-r.top};

  cv.addEventListener('pointerdown',e=>{

  function persist(){
    try{
      if(isSample){localStorage.removeItem(KEY2);localStorage.removeItem(KEY);return}
      const rd=s=>({...s,pts:s.pts.map(p=>[Math.round(p[0]*10)/10,Math.round(p[1]*10)/10])});
      const data=JSON.stringify({nextId,active,layers:layers.map(L=>({...L,strokes:L.strokes.map(rd)}))});
      if(data.length<4e6){localStorage.setItem(KEY2,data);localStorage.removeItem(KEY)}
    }catch(_){}
  }

  function sample(){
    const cx=W/2,cy=H/2+H*0.04,R=Math.min(W,H)*0.24,out=[];
    const mk=(pts,size)=>out.push({pts,color:'#4b4b4b',size:size||3,amp:2.5,freq:6,erase:false,seed:(Math.random()*1e9)|0});
    const arc=(x,y,rx,ry,a0,a1,n)=>{const p=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;p.push([x+Math.cos(a)*rx,y+Math.sin(a)*ry])}return p};
    mk(arc(cx,cy,R,R*0.9,Math.PI*1.12,Math.PI*3.0,120));
    mk([[cx-R*0.82,cy-R*0.42],[cx-R*0.78,cy-R*1.2],[cx-R*0.3,cy-R*0.86]]);
    mk([[cx+R*0.3,cy-R*0.86],[cx+R*0.78,cy-R*1.2],[cx+R*0.82,cy-R*0.42]]);
    mk(arc(cx-R*0.38,cy+R*0.02,R*0.14,R*0.1,Math.PI*1.1,Math.PI*1.9,20),4);
    mk(arc(cx+R*0.38,cy+R*0.02,R*0.14,R*0.1,Math.PI*1.1,Math.PI*1.9,20),4);
    mk([[cx-R*0.16,cy+R*0.3],[cx-R*0.08,cy+R*0.38],[cx,cy+R*0.3],[cx+R*0.08,cy+R*0.38],[cx+R*0.16,cy+R*0.3]]);
    mk([[cx-R*1.5,cy-R*1.0],[cx-R*1.1,cy-R*1.35]]);
    mk([[cx-R*1.45,cy-R*0.75],[cx-R*1.0,cy-R*1.1]]);
    return out;
  }

  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,3);const r=stage.getBoundingClientRect();W=r.width;H=r.height;
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw();
  }
  new ResizeObserver(resize).observe(stage);
  resize();
  const saved=load();
  if(saved){layers=saved.layers.slice(0,MAXL);nextId=Math.max(saved.nextId||1,...layers.map(l=>l.id+1));active=Math.min(Math.max(0,saved.active|0),layers.length-1)}
  else{const L=newLayer();L.strokes=sample();layers=[L];active=0;isSample=true;hint.hidden=false}
  function applyLang(){
    document.documentElement.lang=lang;
    document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=t(el.dataset.i)});
    document.querySelectorAll('[data-ih]').forEach(el=>{el.innerHTML=t(el.dataset.ih)});
    $('zoom').title=t('zoomTip');$('outImg').alt=t('imgAlt');$('swatches').setAttribute('aria-label',t('colors'));
    $('mirrorL').textContent=mirrorLabel();sliderUps.forEach(f=>f());resetClear();
    clearTimeout(delArmed);delArmed=null;$('delLayer').textContent=t('del');
    renderLayers();
  }
  $('lang').value=lang;
  $('lang').onchange=e=>{lang=e.target.value;try{localStorage.setItem('wobble-lang',lang)}catch(_){}applyLang()};
  applyLang();
  draw();
})();
</script>
